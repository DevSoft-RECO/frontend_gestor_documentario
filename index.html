<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // PRE-BOOT THEME DETECTION: Prevents white flash during loading
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    /* --- VARIABLES DE DISEÑO (LIGHT / DARK) --- */
    :root {
      /* Modo Claro (Light) - Colores más vivos */
      --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e2effa 100%);
      --text-color: #0c1e36;
      --text-shadow: rgba(0, 0, 0, 0.04);
      --subtitle-color: #0284c7;
      --subtag-color: #5b708a;
      --paper-fill: rgba(219, 234, 254, 0.7);
      --badge-border: rgba(2, 132, 199, 0.4);
      --badge-bg: rgba(2, 132, 199, 0.06);
      --badge-color: #0284c7;
      --badge-shadow: rgba(2, 132, 199, 0.1);
      --ring-border: rgba(2, 132, 199, 0.2);
      --ring-dot: #0284c7;
      --svg-glow: rgba(2, 132, 199, 0.25);
      
      --grad-start: #0284c7;
      --grad-end: #10b981; /* Verde esmeralda vivo */
      --laser-color: #10b981;
    }

    .dark {
      /* Modo Oscuro (Dark) - Colores súper eléctricos y vivos */
      --bg-gradient: radial-gradient(circle at center, #070d1e 0%, #02040a 100%);
      --text-color: #ffffff;
      --text-shadow: rgba(0, 242, 254, 0.3);
      --subtitle-color: #00ff87; /* Verde neón muy vivo */
      --subtag-color: #94a3b8;
      --paper-fill: rgba(10, 25, 47, 0.55);
      --badge-border: rgba(0, 255, 135, 0.4);
      --badge-bg: rgba(0, 255, 135, 0.05);
      --badge-color: #00ff87;
      --badge-shadow: rgba(0, 255, 135, 0.15);
      --ring-border: rgba(0, 242, 254, 0.2);
      --ring-dot: #39ff14; /* Verde láser puro */
      --svg-glow: rgba(0, 242, 254, 0.4);
      
      --grad-start: #00f2fe; /* Cian eléctrico */
      --grad-end: #00ff87;   /* Verde neón */
      --laser-color: #39ff14; /* Verde láser */
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-gradient);
      transition: background-color 0.3s ease;
    }

    /* --- FONDO Y CONTENEDOR PRINCIPAL --- */
    #loading-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* --- CONTENEDOR CENTRAL DE CARGA --- */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
    }

    /* --- ANIMACIÓN HOLOGRÁFICA DE DOCUMENTO (SCANNER) --- */
    .doc-scanner-wrapper {
      position: relative;
      width: 130px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .doc-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 14px var(--svg-glow));
    }

    .doc-paper {
      fill: var(--paper-fill);
      stroke: url(#docBorderGrad);
      stroke-width: 2;
      transition: fill 0.3s ease;
    }

    /* Líneas simuladas de texto con latido */
    .doc-line {
      animation: pulse-line 2.5s infinite ease-in-out;
      transform-origin: left;
    }
    .doc-line.delayed-1 { animation-delay: 0.4s; }
    .doc-line.delayed-2 { animation-delay: 0.8s; }
    .doc-line.delayed-3 { animation-delay: 1.2s; }

    @keyframes pulse-line {
      0%, 100% {
        opacity: 0.3;
        transform: scaleX(0.95);
      }
      50% {
        opacity: 1;
        transform: scaleX(1);
      }
    }

    /* Rayo láser de escaneo */
    .scan-laser {
      animation: scan-translation 3s ease-in-out infinite;
    }

    @keyframes scan-translation {
      0%, 100% {
        transform: translateY(0px);
        opacity: 0.2;
      }
      50% {
        transform: translateY(75px);
        opacity: 1;
        filter: drop-shadow(0 0 6px var(--laser-color));
      }
    }

    /* Anillo exterior de datos rotatorio */
    .glow-ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px dashed var(--ring-border);
      animation: rotate-ring 15s linear infinite;
      pointer-events: none;
    }

    .glow-ring::after {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: var(--ring-dot);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--ring-dot);
    }

    @keyframes rotate-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* --- TEXTO Y LOGOTIPO --- */
    .brand-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: breathe 4s infinite ease-in-out;
    }

    /* Resaltar HUM como título principal */
    .system-title {
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: 8px;
      text-indent: 8px; /* Corrige centrado del letter-spacing */
      color: var(--text-color);
      line-height: 1.1;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--text-shadow);
      transition: color 0.3s ease;
    }

    /* Gestor Documental como subtítulo destacado */
    .system-subtitle {
      font-size: 0.75rem;
      color: var(--subtitle-color);
      letter-spacing: 4px;
      text-indent: 4px;
      margin-top: 6px;
      margin-bottom: 18px;
      font-weight: 800;
      text-transform: uppercase;
      border: 1px solid var(--badge-border);
      padding: 6px 20px;
      border-radius: 30px;
      background: var(--badge-bg);
      backdrop-filter: blur(8px);
      box-shadow: 0 0 20px var(--badge-shadow);
      transition: all 0.3s ease;
    }

    /* Yaman Kutx como secundario elegante en el pie */
    .brand-group {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 0.55rem;
      color: var(--subtag-color);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.65;
      transition: color 0.3s ease;
    }

    .brand-separator {
      opacity: 0.4;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.95;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div id="loading-wrapper">
    <div class="loader-container">
      <!-- Animated Document Scanner -->
      <div class="doc-scanner-wrapper">
        <svg class="doc-svg" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Document Body -->
          <rect class="doc-paper" x="15" y="15" width="70" height="90" rx="6" />
          
          <!-- Folded Corner -->
          <path d="M65 15 L85 35 L65 35 Z" fill="url(#foldGrad)" />
          <path d="M65 35 L85 35 L65 15 Z" stroke="url(#docBorderGrad)" stroke-width="1.5" fill="none" />
          
          <!-- Mock text lines (inside the document) -->
          <rect class="doc-line" x="27" y="42" width="46" height="4" rx="2" fill="url(#lineGrad)" />
          <rect class="doc-line delayed-1" x="27" y="54" width="36" height="4" rx="2" fill="url(#lineGrad)" />
          <rect class="doc-line delayed-2" x="27" y="66" width="42" height="4" rx="2" fill="url(#lineGrad)" />
          <rect class="doc-line delayed-3" x="27" y="78" width="28" height="4" rx="2" fill="url(#lineGrad)" />
          
          <!-- Holographic scanner laser line -->
          <g class="scan-laser">
            <line x1="10" y1="25" x2="90" y2="25" stroke="url(#laserGrad)" stroke-width="2.5" />
            <!-- Soft glow under the laser -->
            <rect x="10" y="24" width="80" height="2" fill="url(#laserGlowGrad)" opacity="0.5" />
          </g>
          
          <!-- Definitions of Gradients -->
          <defs>
            <linearGradient id="docBorderGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--grad-start)" />
              <stop offset="100%" stop-color="var(--grad-end)" />
            </linearGradient>
            <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--grad-start)" stop-opacity="0.9" />
              <stop offset="100%" stop-color="var(--grad-end)" stop-opacity="0.2" />
            </linearGradient>
            <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="var(--grad-start)" stop-opacity="0.9" />
              <stop offset="100%" stop-color="var(--grad-end)" stop-opacity="0.3" />
            </linearGradient>
            <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="transparent" />
              <stop offset="15%" stop-color="var(--laser-color)" />
              <stop offset="50%" stop-color="var(--laser-color)" />
              <stop offset="85%" stop-color="var(--laser-color)" />
              <stop offset="100%" stop-color="transparent" />
            </linearGradient>
            <linearGradient id="laserGlowGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--laser-color)" />
              <stop offset="100%" stop-color="transparent" />
            </linearGradient>
          </defs>
        </svg>
        
        <!-- Dashed Outer Data Ring -->
        <div class="glow-ring"></div>
      </div>

      <!-- Brand and System name -->
      <div class="brand-content">
        <div class="system-title">HUM</div>
        <div class="system-subtitle">Gestor Documental</div>
        
        <div class="brand-group">
          <span>Yaman</span>
          <span class="brand-separator">•</span>
          <span>Kutx</span>
          <span class="brand-separator">•</span>
          <span>Sistemas</span>
        </div>
      </div>
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
